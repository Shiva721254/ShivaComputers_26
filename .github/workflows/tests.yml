name: Tests

# Runs the test suite on every feature branch, on develop and on pull requests.
# Pushes to main are tested by the deploy workflow before it uploads anything.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install packages
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
